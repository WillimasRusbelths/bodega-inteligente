<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BodegIA MVP</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --surface: #ffffff;
        --surface-soft: #eef4f3;
        --ink: #17212b;
        --muted: #607080;
        --line: #dbe2e8;
        --accent: #18746d;
        --accent-strong: #0f5f59;
        --warning: #b7791f;
        --danger: #b83b3b;
        --ok: #237a4b;
        color: var(--ink);
        background: var(--bg);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      a {
        color: inherit;
      }
      button,
      input,
      select {
        font: inherit;
      }
      .shell {
        min-height: 100vh;
      }
      .login-screen {
        align-items: center;
        display: grid;
        min-height: 100vh;
        padding: 24px;
      }
      .login-panel {
        background:
          linear-gradient(135deg, rgba(24, 116, 109, 0.08), transparent 40%),
          var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 24px 70px rgba(23, 33, 43, 0.12);
        margin: 0 auto;
        max-width: 820px;
        padding: clamp(28px, 5vw, 56px);
        width: 100%;
      }
      .login-panel h1 {
        font-size: clamp(2.7rem, 8vw, 5rem);
        line-height: 0.95;
        margin: 14px 0;
      }
      .login-subtitle {
        color: var(--ink);
        font-size: clamp(1.15rem, 3vw, 1.55rem);
        margin: 0;
      }
      .login-copy,
      .login-note,
      .section-heading p,
      .app-topbar p,
      .card p {
        color: var(--muted);
      }
      .login-roles {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin: 28px 0;
      }
      .login-role-card {
        background: #f8fafb;
        border: 1px solid var(--line);
        border-radius: 12px;
        cursor: pointer;
        display: grid;
        gap: 6px;
        padding: 16px;
      }
      .login-role-card input {
        accent-color: var(--accent);
      }
      .login-role-card span {
        font-weight: 800;
      }
      .login-role-card small {
        color: var(--muted);
        line-height: 1.4;
      }
      .login-role-card.is-selected {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .login-form,
      .settings-form {
        display: grid;
        gap: 12px;
      }
      .settings-form {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .login-form label,
      .settings-form label {
        color: var(--muted);
        display: grid;
        font-size: 0.82rem;
        font-weight: 800;
        gap: 6px;
        text-transform: uppercase;
      }
      .login-form input,
      .settings-form input,
      .settings-form select {
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--ink);
        padding: 11px 12px;
        text-transform: none;
      }
      .login-form .primary-action,
      .settings-form .primary-action,
      .settings-form .form-status {
        align-self: end;
      }
      .form-error,
      .form-status,
      .permission-note,
      .session-chip {
        color: var(--muted);
        margin: 0;
      }
      .form-error {
        color: var(--danger);
        font-weight: 700;
      }
      .locked-panel {
        background:
          linear-gradient(135deg, rgba(183, 121, 31, 0.08), transparent 45%),
          var(--surface);
      }
      .mode-label,
      .eyebrow,
      .privacy-chip {
        border: 1px solid rgba(24, 116, 109, 0.2);
        border-radius: 999px;
        color: var(--accent-strong);
        display: inline-flex;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        padding: 6px 10px;
        text-transform: uppercase;
      }
      .primary-action,
      .secondary-action {
        border: 0;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 800;
        padding: 12px 18px;
      }
      .primary-action {
        background: var(--accent);
        color: white;
      }
      .secondary-action {
        background: #edf2f4;
        color: var(--ink);
      }
      .app-shell {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        background: #18232d;
        color: #f7fafb;
        padding: 24px 18px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand-block {
        display: grid;
        gap: 4px;
        margin-bottom: 24px;
      }
      .brand-block strong {
        font-size: 1.35rem;
      }
      .brand-block span {
        color: #bac7d2;
      }
      .sidebar nav {
        display: grid;
        gap: 8px;
      }
      .sidebar a {
        border-radius: 10px;
        color: #eaf0f4;
        padding: 11px 12px;
        text-decoration: none;
      }
      .sidebar a:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .dashboard-main {
        min-width: 0;
        padding: 24px;
      }
      .app-topbar,
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(23, 33, 43, 0.05);
        margin-bottom: 18px;
      }
      .app-topbar {
        align-items: center;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        padding: 20px;
      }
      .app-topbar h1,
      .section-heading h2,
      .card h3 {
        margin: 8px 0;
      }
      .topbar-actions {
        align-items: flex-end;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .panel {
        padding: 20px;
      }
      .section-heading {
        margin-bottom: 16px;
      }
      .kpi-grid,
      .content-grid,
      .role-grid,
      .roadmap-grid {
        display: grid;
        gap: 14px;
      }
      .kpi-grid {
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }
      .kpi-grid.compact {
        margin-bottom: 16px;
      }
      .kpi-card,
      .card,
      .summary-strip span,
      .roadmap-grid span {
        background: #f8fafb;
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .kpi-card {
        padding: 16px;
      }
      .kpi-card span,
      .metric span {
        color: var(--muted);
        display: block;
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }
      .kpi-card strong {
        display: block;
        font-size: 2rem;
        line-height: 1;
        margin-top: 10px;
      }
      .kpi-warning strong {
        color: var(--warning);
      }
      .kpi-danger strong {
        color: var(--danger);
      }
      .kpi-money strong {
        color: var(--accent);
      }
      .two-columns {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .card {
        padding: 16px;
        min-width: 0;
      }
      .summary-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
      }
      .summary-strip span,
      .roadmap-grid span {
        padding: 9px 11px;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        min-width: 520px;
        width: 100%;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 10px 8px;
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-size: 0.76rem;
        text-transform: uppercase;
      }
      td small {
        color: var(--muted);
        display: block;
        margin-top: 4px;
      }
      .status-badge {
        background: #edf2f4;
        border-radius: 999px;
        display: inline-flex;
        font-size: 0.72rem;
        font-weight: 800;
        padding: 5px 8px;
      }
      .status-active,
      .status-available,
      .status-ok {
        background: #e4f4eb;
        color: var(--ok);
      }
      .status-low_stock,
      .status-expiring_soon {
        background: #fff3d7;
        color: var(--warning);
      }
      .status-expired,
      .status-danger {
        background: #fae8e8;
        color: var(--danger);
      }
      .fefo-box,
      .alert-summary {
        align-items: center;
        background: var(--surface-soft);
        border-radius: 12px;
        display: flex;
        justify-content: space-between;
        margin-top: 14px;
        padding: 12px;
      }
      .fefo-box {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
      .flow {
        align-items: center;
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-bottom: 16px;
        text-align: center;
      }
      .flow span,
      .flow strong {
        background: #f8fafb;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 10px;
      }
      .star-model {
        display: grid;
        gap: 14px;
        grid-template-columns: 1fr 1.2fr 1fr;
      }
      .source-list,
      .dimension-ring,
      .fact-core {
        background: #f8fafb;
        border: 1px solid var(--line);
        border-radius: 12px;
        display: grid;
        gap: 9px;
        padding: 16px;
      }
      .dimension-ring span,
      .fact-core strong,
      .source-list span {
        background: white;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px;
      }
      .fact-core {
        background: #eef4f3;
      }
      .bar-row {
        align-items: center;
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(110px, 1fr) 2fr auto;
        margin: 12px 0;
      }
      .bar-track {
        background: #e3e9ee;
        border-radius: 999px;
        height: 10px;
        overflow: hidden;
      }
      .bar-fill {
        background: var(--accent);
        height: 100%;
      }
      .role-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .roadmap-grid {
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      }
      @media (max-width: 900px) {
        .app-shell {
          display: block;
        }
        .sidebar {
          height: auto;
          position: static;
        }
        .sidebar nav {
          display: flex;
          flex-wrap: wrap;
        }
        .dashboard-main {
          padding: 14px;
        }
        .two-columns,
        .star-model,
        .role-grid,
        .flow,
        .login-roles,
        .settings-form {
          grid-template-columns: 1fr;
        }
        .app-topbar,
        .topbar-actions {
          align-items: flex-start;
          flex-direction: column;
        }
      }
      @media (max-width: 560px) {
        .login-screen {
          padding: 12px;
        }
        .login-panel,
        .panel,
        .app-topbar {
          border-radius: 12px;
          padding: 16px;
        }
        .kpi-card strong {
          font-size: 1.6rem;
        }
        .bar-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="shell">
      <p role="status">Cargando demo...</p>
    </div>
    <script type="module" src="/dist/src/demo/browser.js"></script>
  </body>
</html>
