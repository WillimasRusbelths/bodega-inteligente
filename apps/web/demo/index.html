<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BodegIA MVP</title>
    <style>
      :root {
        color: #17202a;
        background: #f7f8fa;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        margin: 0;
      }
      a {
        color: inherit;
      }
      .shell {
        margin: 0 auto;
        max-width: 1180px;
        padding: 32px 20px 48px;
      }
      .topbar,
      section,
      main[data-testid] {
        background: #ffffff;
        border: 1px solid #d8dee8;
        border-radius: 8px;
        margin-block: 16px;
        padding: 18px;
      }
      .topbar {
        align-items: center;
        display: flex;
        gap: 16px;
        justify-content: space-between;
      }
      .eyebrow {
        color: #4d6376;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      h1,
      h2,
      h3 {
        letter-spacing: 0;
        margin: 0 0 10px;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3.3rem);
      }
      h2 {
        font-size: 1.25rem;
      }
      .grid,
      dl[data-testid="bi-kpis"] {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      }
      .metric {
        background: #f3f6f9;
        border: 1px solid #d8dee8;
        border-radius: 8px;
        padding: 12px;
      }
      .metric span,
      dt {
        color: #4d6376;
        display: block;
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
      }
      .metric strong,
      dd {
        display: block;
        font-size: 1.55rem;
        font-weight: 800;
        margin: 6px 0 0;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border-bottom: 1px solid #e5e9ef;
        padding: 9px 8px;
        text-align: left;
      }
      th {
        color: #4d6376;
        font-size: 0.78rem;
        text-transform: uppercase;
      }
      ul,
      ol {
        padding-left: 22px;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      nav a,
      .pill {
        background: #eef3f8;
        border: 1px solid #d8dee8;
        border-radius: 999px;
        display: inline-flex;
        padding: 7px 10px;
        text-decoration: none;
      }
      select {
        border: 1px solid #b7c2cf;
        border-radius: 6px;
        padding: 8px 10px;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      input,
      select {
        margin-left: 6px;
      }
      .notice {
        background: #fff7df;
        border-color: #ead08b;
      }
      @media (max-width: 720px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
        th:nth-child(4),
        td:nth-child(4) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="shell">
      <p role="status">Cargando demo...</p>
    </div>
    <script type="module" src="/dist/src/demo/browser.js"></script>
  </body>
</html>
